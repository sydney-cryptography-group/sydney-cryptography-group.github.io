title: Sydney Blockchain Centre
email: jiangshan.yu@sydney.edu.au
description: >
  Website for the Sydney Blockchain Centre.
baseurl: ""
url: ""

include:
  - _pages

sass:
  sass_dir: _sass

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - vendor
  - .playwright-mcp
  - "*.png"
  - research-screenshots
